<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inicio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="photo-wallpaper" data-phase="day">
  <!-- Background photo: two layers so the wallpaper can crossfade with the time of day. -->
  <div id="wallpaper" aria-hidden="true">
    <div id="wallpaperA" class="wallpaperLayer"></div>
    <div id="wallpaperB" class="wallpaperLayer"></div>

    <!-- Optional fallback: the old stylised coastal city. It is hidden when a
         photo wallpaper is active; the default background uses the real photos. -->
    <div id="coastScene">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="sky-stop" style="stop-color:var(--sky-top)"/>
            <stop offset=".58" class="sky-stop" style="stop-color:var(--sky-mid)"/>
            <stop offset="1" class="sky-stop" style="stop-color:var(--sky-bottom)"/>
          </linearGradient>
          <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" class="sea-stop" style="stop-color:var(--sea-top)"/>
            <stop offset="1" class="sea-stop" style="stop-color:var(--sea-bottom)"/>
          </linearGradient>
          <radialGradient id="sunGlow">
            <stop offset="0" style="stop-color:var(--sun);stop-opacity:.55"/>
            <stop offset=".4" style="stop-color:var(--sun);stop-opacity:.16"/>
            <stop offset="1" style="stop-color:var(--sun);stop-opacity:0"/>
          </radialGradient>
          <linearGradient id="beamGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" style="stop-color:var(--beam);stop-opacity:.3"/>
            <stop offset="1" style="stop-color:var(--beam);stop-opacity:0"/>
          </linearGradient>
          <pattern id="winA" width="28" height="32" patternUnits="userSpaceOnUse">
            <rect class="win d1" x="5" y="6" width="11" height="13" rx="1.5"/>
          </pattern>
          <pattern id="winB" width="28" height="32" patternUnits="userSpaceOnUse">
            <rect class="win d2" x="5" y="6" width="11" height="13" rx="1.5"/>
          </pattern>
          <pattern id="winC" width="28" height="32" patternUnits="userSpaceOnUse">
            <rect class="win d3" x="5" y="6" width="11" height="13" rx="1.5"/>
          </pattern>
        </defs>

        <!-- Sky, stars and celestial light. -->
        <rect class="sky" width="1920" height="700" fill="url(#skyGrad)"/>
        <g class="stars">
          <circle cx="120" cy="120" r="2"/><circle cx="240" cy="210" r="1.5"/>
          <circle cx="360" cy="90" r="1.8"/><circle cx="500" cy="160" r="1.2"/>
          <circle cx="610" cy="70" r="2"/><circle cx="760" cy="130" r="1.4"/>
          <circle cx="870" cy="250" r="1.8"/><circle cx="980" cy="100" r="1.5"/>
          <circle cx="1090" cy="180" r="1.2"/><circle cx="1220" cy="80" r="2"/>
          <circle cx="1330" cy="160" r="1.4"/><circle cx="1450" cy="110" r="1.7"/>
          <circle cx="1580" cy="230" r="1.2"/><circle cx="1700" cy="90" r="2"/>
          <circle cx="1820" cy="180" r="1.5"/><circle cx="300" cy="330" r="1.2"/>
          <circle cx="950" cy="300" r="1.3"/><circle cx="1400" cy="300" r="1.1"/>
        </g>
        <circle class="sun-glow" cx="680" cy="200" r="220" fill="url(#sunGlow)"/>
        <circle class="sun" cx="680" cy="200" r="56"/>
        <circle class="moon" cx="680" cy="200" r="48"/>
        <g class="clouds">
          <path d="M150,300 q28,-30 64,-16 q24,-30 62,-8 q34,-12 48,18 q26,10 18,32 h-190 q-18,-16 -2,-26 z"/>
          <path d="M1030,250 q24,-24 54,-12 q20,-22 52,-5 q28,-8 38,16 q20,10 12,25 h-156 q-16,-14 0,-24 z"/>
          <path d="M1510,340 q20,-20 46,-9 q18,-18 44,-4 q24,-7 32,14 q17,8 10,22 h-132 q-14,-12 0,-23 z"/>
        </g>
        <g class="birds">

          <path d="M820,315 q8,-6 16,0 q8,-6 16,0"/>
        </g>

        <!-- Headland, sea and the far lighthouse. -->

        <ellipse class="haze" cx="600" cy="650" rx="520" ry="42"/>
        <rect class="sea" x="0" y="650" width="1920" height="430" fill="url(#seaGrad)"/>

        <path class="promenade" d="M780,718 C980,688 1250,678 1500,676 C1700,674 1840,678 1920,688"/>
        <g class="city">
          <rect class="building" x="930" y="580" width="80" height="140" rx="4"/>
          <rect class="win-layer" x="938" y="590" width="64" height="122" fill="url(#winA)"/>
          <rect class="roof" x="948" y="572" width="44" height="9" rx="2"/>

          <rect class="building" x="1015" y="520" width="95" height="200" rx="4"/>
          <rect class="win-layer" x="1023" y="530" width="79" height="182" fill="url(#winB)"/>
          <path class="antenna" d="M1062,520 V474"/>

          <rect class="building" x="1115" y="600" width="70" height="120" rx="4"/>
          <rect class="win-layer" x="1123" y="610" width="54" height="102" fill="url(#winC)"/>

          <rect class="building" x="1190" y="470" width="120" height="250" rx="4"/>
          <rect class="win-layer" x="1198" y="480" width="104" height="232" fill="url(#winA)"/>
          <path class="antenna" d="M1250,470 V414"/>
          <circle class="beacon" cx="1250" cy="412" r="3"/>

          <rect class="building" x="1315" y="560" width="90" height="160" rx="4"/>
          <rect class="win-layer" x="1323" y="570" width="74" height="142" fill="url(#winB)"/>

          <rect class="building" x="1410" y="620" width="75" height="100" rx="4"/>
          <rect class="win-layer" x="1418" y="630" width="59" height="82" fill="url(#winC)"/>

          <rect class="building" x="1490" y="500" width="110" height="220" rx="4"/>
          <rect class="win-layer" x="1498" y="510" width="94" height="202" fill="url(#winB)"/>
          <rect class="roof" x="1508" y="492" width="74" height="9" rx="2"/>

          <rect class="building" x="1605" y="580" width="90" height="140" rx="4"/>
          <rect class="win-layer" x="1613" y="590" width="74" height="122" fill="url(#winA)"/>

          <rect class="building" x="1700" y="540" width="100" height="180" rx="4"/>
          <rect class="win-layer" x="1708" y="550" width="84" height="162" fill="url(#winC)"/>
          <path class="antenna" d="M1750,540 V498"/>
          <circle class="beacon" cx="1750" cy="496" r="3"/>

          <rect class="building" x="1805" y="610" width="115" height="110" rx="4"/>
          <rect class="win-layer" x="1813" y="620" width="99" height="92" fill="url(#winB)"/>
        </g>

        <!-- Little details: the lighthouse sits at the far left, clear of the hero title. -->
        <g class="lighthouse">
          <path class="beam" d="M70,502 L454,450 L454,554 Z"/>
          <path class="lighthouse-body" d="M50,620 L60,510 L88,510 L98,620 Z"/>
          <rect class="lighthouse-stripe" x="55" y="535" width="38" height="14"/>
          <rect class="lighthouse-stripe" x="53" y="575" width="42" height="14"/>
          <rect class="lighthouse-cap" x="52" y="502" width="44" height="10" rx="3"/>
          <circle class="lighthouse-lamp" cx="74" cy="497" r="6"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Ambient glow in the colour of the focused dock app; two layers so colours crossfade. -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <!-- Top shelf: the focused dock app's name, above the dock. -->
  <div id="hero"></div>

  <header>
    <div id="leftBlock">
      <div id="greeting"></div>
      <div id="timeRow">
        <span id="clock"></span><span id="ampm"></span><span class="divider"></span><span id="date"></span>
      </div>
      <div id="weatherRow" class="hidden">
        <span id="weatherIcon"></span>
        <span id="weatherTemp"></span>
        <span id="weatherDesc"></span>
        <span id="weatherCity"></span>
      </div>
      <div id="forecastRow" class="hidden"></div>
    </div>
    <div id="topButtons">
      <div class="pill" id="btnHome">
        <svg viewBox="0 0 24 24"><path d="M10,20v-6h4v6h5v-8h3L12,3L2,12h3v8H10z"/></svg>
        <span>Casa</span>
      </div>
      <div class="pill" id="btnInputs">
        <svg viewBox="0 0 24 24"><path d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"/></svg>
        <span>Entradas</span>
      </div>
      <div class="pill" id="btnWifi">
        <svg viewBox="0 0 24 24"><path d="M1,9l2,2c4.97,-4.97 13.030,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/></svg>

        <span>Ajustes</span>
      </div>
    </div>
  </header>

  <!-- Antena TV: quick channel picker, opened from the TV tile. -->
  <div id="antennaPanel" class="hidden" role="dialog" aria-label="Antena TV">
    <div id="antennaHeader">
      <div id="antennaHeading">
        <span id="antennaTitle">Antena TV</span>
        <span id="antennaSub">Canales principales</span>
      </div>
      <div id="antennaStatus">Canales 1–8</div>
    </div>
    <div id="antennaGrid"></div>
    <div id="antennaHint">Flechas o 1–8 para elegir · OK para ver · Atrás para volver</div>
  </div>

  <!-- Everything below the header scrolls together: dock band, tiles and the glass highlight. -->
  <div id="viewport">
    <div id="stage">
      <div id="dockBand"></div>
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- Dropdown under the Inputs pill. -->
  <div id="inputsPanel" class="hidden"></div>

  <!-- Home Assistant: favorite lights, switches, sensors and scenes. -->

    <div id="haHeader">
